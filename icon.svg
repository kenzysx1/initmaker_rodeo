<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="22" y="10" width="56" height="80" rx="7" fill="#ffffff" stroke="#c0c0d0" stroke-width="2.5" filter="url(#cardShadow)" />
  <!-- Card Header Symbol & Suit -->
  <text x="29" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e1e1e">A</text>
  <text x="29" y="38" font-family="Arial, sans-serif" font-size="12" fill="#1e1e1e">♠</text>
  <!-- Center Large Spade -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="30" fill="#1e1e1e" text-anchor="middle">♠</text>
  <!-- Sword / Combat Badge at Corner -->
  <circle cx="68" cy="76" r="14" fill="#7c3aed" stroke="#ffffff" stroke-width="2" />
  <text x="68" y="81" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">⚔️</text>
</svg>